<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CCFBF1"/>
      <stop offset="100%" stop-color="#99F6E4"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Light mint background -->
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Grid overlay -->
    <g opacity="0.2">
      <line x1="0" y1="128" x2="512" y2="128" stroke="#0D9488" stroke-width="1.5"/>
      <line x1="0" y1="256" x2="512" y2="256" stroke="#0D9488" stroke-width="1.5"/>
      <line x1="0" y1="384" x2="512" y2="384" stroke="#0D9488" stroke-width="1.5"/>
      <line x1="128" y1="0" x2="128" y2="512" stroke="#0D9488" stroke-width="1.5"/>
      <line x1="256" y1="0" x2="256" y2="512" stroke="#0D9488" stroke-width="1.5"/>
      <line x1="384" y1="0" x2="384" y2="512" stroke="#0D9488" stroke-width="1.5"/>
    </g>

    <!-- Cloud -->
    <g transform="translate(256, 175)">
      <rect x="-120" y="-10" width="240" height="60" rx="30" fill="#0D9488"/>
      <circle cx="-60" cy="-10" r="50" fill="#0D9488"/>
      <circle cx="10" cy="-30" r="58" fill="#0D9488"/>
      <circle cx="70" cy="-8" r="45" fill="#0D9488"/>
    </g>

    <!-- Lightning bolt -->
    <polygon
      points="244,190 208,275 242,275 200,390 300,258 264,258 300,190"
      fill="#14B8A6"
    />

    <!-- White DEV banner flush across bottom -->
    <rect x="-10" y="440" width="532" height="80" fill="#FFFFFF"/>
    <text x="256" y="492" font-family="Caveat, Segoe Script, Comic Sans MS, cursive" font-weight="bold" font-size="40" fill="#0D9488" text-anchor="middle">DEV</text>
  </g>
</svg>
